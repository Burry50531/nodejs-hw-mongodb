tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: Endpoint for registering a new user 
security: []
requestBody: 
  required: true
  content:
    application/json: 
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            example: Anatolii Romanenko
          email:
            type: string
            example: Anatolii@example.com
          password:
            type: string
            example: mySecurePass123

responses:
  '201': 
    description: User successfully registered
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: User created successfully!
            data:
              type: object
              properties:
                userId:
                  type: string
                  example: 65ca67e7ae7f10c88b598384 

  '400':
    $ref: '../../components/responses/400.yaml'

  '409': 
    $ref: '../../components/responses/409.yaml'

  '500': 
    $ref: '../../components/responses/500.yaml'